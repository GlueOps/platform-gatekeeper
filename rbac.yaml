apiVersion: v1
kind: Namespace
metadata:
  name: glueops-core-gatekeeper
  labels:
    gatekeeper.platform.glueops.dev/mode: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glueops-core-gatekeeper
  namespace: glueops-core-gatekeeper
---
# The ceiling on what any Gate can observe. Never grant secrets or configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glueops-core-gatekeeper
rules:
  - apiGroups: ["platform.glueops.dev"]
    resources: ["gates"]
    verbs: ["list"]

  - apiGroups: ["platform.glueops.dev"]
    resources: ["gates/status"]
    verbs: ["patch"]

  # Resolves the mode label on a Gate's namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]

  # One rule per supported check type.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]

  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glueops-core-gatekeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glueops-core-gatekeeper
subjects:
  - kind: ServiceAccount
    name: glueops-core-gatekeeper
    namespace: glueops-core-gatekeeper
