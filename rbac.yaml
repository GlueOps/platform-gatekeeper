apiVersion: v1
kind: Namespace
metadata:
  name: glueops-core-gatekeeper
  labels:
    gatekeeper.platform.glueops.dev/mode: platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glueops-core-gatekeeper
  namespace: glueops-core-gatekeeper
---
# This ClusterRole is the ceiling on what any Gate can observe. Gatekeeper reads
# dependencies with its own identity, so a kind granted here becomes readable by
# any Gate (within its own namespace, or an allowlisted namespace in platform
# mode). Add kinds deliberately, and never grant secrets or configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glueops-core-gatekeeper
rules:
  # The reconcile loop lists every Gate each sweep and merge-patches its status.
  # Deliberately no `get` (nothing reads a single Gate) and no `update` (status is
  # only ever merge-patched).
  - apiGroups: ["platform.glueops.dev"]
    resources: ["gates"]
    verbs: ["list"]

  - apiGroups: ["platform.glueops.dev"]
    resources: ["gates/status"]
    verbs: ["patch"]

  # Resolves the customer/platform mode label on a Gate's namespace.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]

  # Allowlisted dependency reads, one rule per supported check type.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get"]

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get"]

  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glueops-core-gatekeeper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glueops-core-gatekeeper
subjects:
  - kind: ServiceAccount
    name: glueops-core-gatekeeper
    namespace: glueops-core-gatekeeper
