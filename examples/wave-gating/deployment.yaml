# An ordinary workload with no annotations: it lands in the default sync-wave (0),
# which Argo CD will not start until the Gate in wave -1 reports Healthy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: nonprod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:alpine
          ports:
            - containerPort: 80
