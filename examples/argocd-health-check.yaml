# Argo CD health check for Gate resources. Platform setup, applied once per Argo CD
# instance.
#
# APPLY IT WITH `kubectl patch`, NOT `kubectl apply`:
#
#   kubectl patch configmap argocd-cm -n argocd --type merge \
#     --patch-file examples/argocd-health-check.yaml
#
# This file is deliberately a patch fragment rather than a full ConfigMap. A
# complete one-key argocd-cm manifest is dangerous: Argo CD installs with
# client-side apply, so `kubectl apply` would three-way-merge and DELETE every other
# key in the live argocd-cm (url, timeout.reconciliation, resource.exclusions, …) —
# after which Argo CD sees argocd-cm OutOfSync and selfHeals it back, silently
# removing this health check and un-gating every Gate in the cluster.
#
# If argocd-cm is managed by Helm or GitOps, add the key there instead (for the
# argo-cd chart that's `configs.cm`), not with the command above.
#
# This is not optional polish: Argo CD has no built-in health assessment for a Gate,
# and a resource with no health check is *skipped* in the Application health rollup —
# the wave task is marked succeeded immediately and the next wave proceeds ungated.
# Without this script, Gates do nothing.
#
# Editing argocd-cm needs no restart, but it does trigger a full re-list. A syntax
# error here is loud — the operation goes phase=Error with a parse error and nothing
# is created. What's quiet is *removing* this key: the sync then succeeds, the
# workload is created, and the Application reads Healthy with the dependency down.
# Either way, test changes against a real Gate object first — and run
# argocd-health-check_test.lua, which CI runs too.
data:
  resource.customizations.health.platform.glueops.dev_Gate: |
    -- Reasons no amount of waiting can clear: each needs someone to change something
    -- -- the Gate's spec, the namespace's mode label, gatekeeper's ClusterRole or
    -- allowlist, or the stuck dependency itself. EvaluationFailed and
    -- DependenciesNotReady are deliberately absent.
    local stuck = {
      Terminal = true,
      PolicyViolation = true,
      ReadForbidden = true,
      InvalidSpec = true,
    }
    hs = {}
    if obj.status == nil or obj.status.conditions == nil then
      hs.status = "Progressing"
      hs.message = "Awaiting first evaluation"
      return hs
    end
    for i, c in ipairs(obj.status.conditions) do
      if c.type == "Ready" then
        -- metav1 binds observedGeneration to the condition it was set from, so the
        -- condition's own field ties currency to the very condition about to be
        -- trusted; the status-level one is a fallback for writers that set only that.
        local observed = c.observedGeneration or obj.status.observedGeneration
        local generation = obj.metadata and obj.metadata.generation
        if generation == nil or observed ~= generation then
          hs.status = "Progressing"
          hs.message = "Awaiting evaluation of current spec"
          return hs
        end
        hs.message = (c.reason or "") .. ": " .. (c.message or "")
        if c.status == "True" then
          hs.status = "Healthy"
          return hs
        end
        -- Degraded fails the operation rather than waiting. It needs selfHeal: true
        -- to recover afterwards -- see AGENTS.md Decision 15, which records what this
        -- was measured to do.
        if stuck[c.reason] then
          hs.status = "Degraded"
          return hs
        end
        -- Everything else, including Unknown, means keep waiting. An unevaluable
        -- gate makes no claim about the dependency, so Degraded would be wrong.
        hs.status = "Progressing"
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "No Ready condition"
    return hs
