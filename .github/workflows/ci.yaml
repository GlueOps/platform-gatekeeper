name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ghcr.io/quay.io: identical digests, no anonymous pull limit.
      YQ: ghcr.io/mikefarah/yq:4.47.1@sha256:b9285dd3b0bea3c34d0c54415dd48d767dabd9644d489bd6e253660847b58419
      LUA51: nickblah/lua:5.1-alpine@sha256:4d1e728ab63affad53db672f363ec2f416d83decbfd4c9741ee1055e112485c8
      LUA54: nickblah/lua:5.4-alpine@sha256:d2f20d6ec71f987f79ca0f25d5d9a2b3620f97db179f9a2b8f2177c3330952f9
      PROM: quay.io/prometheus/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keeps the job token out of .git/config, which `go test` on a fork PR
          # could read. No step needs git auth after checkout.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # -race needs cgo, so this runs on the Debian image rather than alpine. The
      # three published atomics are written by the sweep and read by /metrics, so
      # a race there is exactly the silent failure this job exists to catch.
      - name: Test (race)
        run: go test -race ./...

      # Two suites `go test` can't reach, whose failure is silent. Mounted on
      # .testtmp so the images see only the files under test.
      - name: Test the Argo CD health check
        if: ${{ !cancelled() }}
        run: |
          # rm first: a PR can commit .testtmp as a symlink to the repo root, which
          # mkdir -p accepts. NEVER add a trailing slash -- it would follow the
          # symlink and delete the checkout.
          rm -rf .testtmp && mkdir -p .testtmp
          cp examples/argocd-health-check_test.lua examples/argocd-health-check.yaml .testtmp/
          docker run --rm -v "$PWD/.testtmp":/workdir "$YQ" \
            '.data["resource.customizations.health.platform.glueops.dev_Gate"]' \
            argocd-health-check.yaml > .testtmp/health.lua
          # 5.1 too: Argo CD embeds gopher-lua, a 5.1 dialect.
          docker run --rm -v "$PWD/.testtmp":/t -w /t "$LUA51" lua argocd-health-check_test.lua
          docker run --rm -v "$PWD/.testtmp":/t -w /t "$LUA54" lua argocd-health-check_test.lua

      - name: Test the staleness alerts
        if: ${{ !cancelled() }}
        run: |
          rm -rf .testtmp && mkdir -p .testtmp
          cp prometheusrule_test.yaml prometheusrule.yaml .testtmp/
          # promtool wants bare rule groups, not the PrometheusRule wrapper.
          docker run --rm -v "$PWD/.testtmp":/workdir "$YQ" '.spec' \
            prometheusrule.yaml > .testtmp/rules.yaml
          docker run --rm -v "$PWD/.testtmp":/t -w /t --entrypoint promtool "$PROM" \
            test rules prometheusrule_test.yaml
