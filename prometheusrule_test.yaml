# promtool unit tests for prometheusrule.yaml. These alerts are the entire
# staleness mitigation, and the obvious expression for "gatekeeper is down" does
# NOT fire for the most likely outage — a pod that is still in service discovery
# but cannot be scraped, where `up` is a present 0 and the gauge goes stale, so a
# naive `absent(up{...})` plus a `time() - gauge` arm are both false. These tests
# pin that behaviour.
#
# Run them (promtool wants bare rule groups, not the PrometheusRule wrapper):
#
#   mkdir -p .promcheck && cp prometheusrule_test.yaml .promcheck/test.yaml
#   docker run --rm -v "$PWD":/w -w /w python:3.12-alpine sh -c \
#     'pip install -q pyyaml && python -c "import yaml;yaml.safe_dump(yaml.safe_load(open(\"prometheusrule.yaml\"))[\"spec\"],open(\".promcheck/rules.yaml\",\"w\"))"'
#   docker run --rm -v "$PWD/.promcheck":/t -w /t --entrypoint promtool \
#     prom/prometheus:v3.5.0 test rules test.yaml
#
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  # The failure the previous expression missed entirely: the pod is still in
  # service discovery but cannot be scraped, so up is a present 0 and the gauge
  # goes stale. Both old arms were false and the alert never fired.
  - interval: 1m
    name: pod present but unscrapable
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x5 0+0x40'
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+0x5 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatekeeperNotReconciling
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Gatekeeper is not publishing Gate readiness
              description: "Gate readiness is stale, so deployments gated on an already-Ready Gate may proceed without their dependencies being verified. Check the gatekeeper Deployment in glueops-core-gatekeeper, then confirm sweeps are completing with `kubectl logs -n glueops-core-gatekeeper deploy/glueops-core-gatekeeper --tail=20 | grep sweep:` (note that `kubectl get gates` will NOT show this: LAST-TRANSITION is deliberately inherited, so a Gate that has been Ready for days looks identical whether it was evaluated seconds or hours ago). Once recovered, review which gated Applications synced during the window. An Argo CD sync stuck waiting on a gate is released with `argocd app terminate-op <app>`."

  - interval: 1m
    name: target gone from service discovery
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x3 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatekeeperNotReconciling
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Gatekeeper is not publishing Gate readiness
              description: "Gate readiness is stale, so deployments gated on an already-Ready Gate may proceed without their dependencies being verified. Check the gatekeeper Deployment in glueops-core-gatekeeper, then confirm sweeps are completing with `kubectl logs -n glueops-core-gatekeeper deploy/glueops-core-gatekeeper --tail=20 | grep sweep:` (note that `kubectl get gates` will NOT show this: LAST-TRANSITION is deliberately inherited, so a Gate that has been Ready for days looks identical whether it was evaluated seconds or hours ago). Once recovered, review which gated Applications synced during the window. An Argo CD sync stuck waiting on a gate is released with `argocd app terminate-op <app>`."

  - interval: 1m
    name: healthy gatekeeper stays quiet
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x40'
      # Sweep timestamp advancing with wall clock; starts near the test epoch.
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+60x40'
      - series: 'gatekeeper_gates_unevaluated{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GatekeeperNotReconciling
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperGatesUnevaluated
        exp_alerts: []
