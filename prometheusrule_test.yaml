# promtool unit tests for prometheusrule.yaml. The obvious "gatekeeper is down"
# expression does NOT fire for the likeliest outage (a pod in service discovery that
# cannot be scraped: `up` is a present 0 and the gauge goes stale), which is what
# these pin, along with the thresholds.
#
# Run from the repo root; same commands .github/workflows/ci.yaml runs:
#
#   mkdir -p .testtmp && cp prometheusrule_test.yaml prometheusrule.yaml .testtmp/
#   docker run --rm -v "$PWD/.testtmp":/workdir mikefarah/yq:4.47.1 '.spec' \
#     prometheusrule.yaml > .testtmp/rules.yaml
#   docker run --rm -v "$PWD/.testtmp":/t -w /t --entrypoint promtool \
#     prom/prometheus:v3.5.0 test rules prometheusrule_test.yaml
#   rm -rf .testtmp
#
# At least one case must assert a FIRING alert: promtool loads a null or empty rule
# file without error.
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # The failure the obvious expression misses entirely: the pod is still in service
  # discovery but cannot be scraped, so `up` is a present 0 and the gauge goes
  # stale. Both the staleness arm and `absent()` are false here.
  - interval: 1m
    name: pod present but unscrapable
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x5 0+0x40'
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+0x5 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatekeeperNotReconciling
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: &stale_annotations
              summary: Gatekeeper is not publishing Gate readiness
              description: "Gate readiness is stale, so deployments gated on an already-Ready Gate may proceed without their dependencies being verified. Check the gatekeeper Deployment in glueops-core-gatekeeper, then confirm sweeps are completing with `kubectl logs -n glueops-core-gatekeeper deploy/glueops-core-gatekeeper --tail=20 | grep sweep:` (note that `kubectl get gates` will NOT show this: LAST-TRANSITION is deliberately inherited, so a Gate that has been Ready for days looks identical whether it was evaluated seconds or hours ago). Once recovered, review which gated Applications synced during the window. An Argo CD sync stuck waiting on a gate is released with `argocd app terminate-op <app>`."

  - interval: 1m
    name: target gone from service discovery
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x3 stale'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatekeeperNotReconciling
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: *stale_annotations

  # The staleness arm on its own: scrapable pod, frozen sweep timestamp. Pins the
  # 300s threshold plus `for: 2m` — the other cases fire via the up/absent arms, so
  # without this a threshold edit would go unnoticed.
  - interval: 1m
    name: live pod with a wedged sweep
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x20'
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: GatekeeperNotReconciling
        exp_alerts: []
      - eval_time: 8m
        alertname: GatekeeperNotReconciling
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: *stale_annotations

  # A live gatekeeper that reaches no verdict: sweeps succeed, so the staleness
  # alert stays quiet, but no Gate carries a usable answer. Pins `for: 15m`.
  - interval: 1m
    name: gates stuck unevaluated
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x20'
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+60x20'
      - series: 'gatekeeper_gates_unevaluated{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: GatekeeperGatesUnevaluated
        exp_alerts: []
      - eval_time: 16m
        alertname: GatekeeperGatesUnevaluated
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: &unevaluated_annotations
              summary: Gatekeeper cannot evaluate some Gates
              description: "One or more Gates have been stuck with Ready=Unknown. Gated rollouts are waiting rather than proceeding, so this blocks deploys rather than risking them. Find the affected Gates with `kubectl get gates -A | grep Unknown` and read `.status.results` for the reason: the API server rejecting gatekeeper's reads, or a dependency whose status cannot be interpreted. Note a missing kind in gatekeeper's ClusterRole does NOT show up here -- that is ReadForbidden, which is Ready=False and surfaces as a Degraded Application instead."
      # The staleness alert must stay quiet throughout: the sweeps are fine.
      - eval_time: 16m
        alertname: GatekeeperNotReconciling
        exp_alerts: []

  - interval: 1m
    name: healthy gatekeeper stays quiet
    input_series:
      - series: 'up{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '1+0x40'
      - series: 'gatekeeper_last_successful_sweep_timestamp_seconds{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+60x40'
      - series: 'gatekeeper_gates_unevaluated{job="glueops-core-gatekeeper",instance="10.0.0.1:8080"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: GatekeeperNotReconciling
        exp_alerts: []
      - eval_time: 30m
        alertname: GatekeeperGatesUnevaluated
        exp_alerts: []
