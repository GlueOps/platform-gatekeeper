apiVersion: apps/v1
kind: Deployment
metadata:
  name: glueops-core-gatekeeper
  namespace: glueops-core-gatekeeper
  labels:
    app.kubernetes.io/name: glueops-core-gatekeeper
spec:
  replicas: 1
  # maxUnavailable: 0 so a bad image can't leave zero reconcilers.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glueops-core-gatekeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glueops-core-gatekeeper
    spec:
      serviceAccountName: glueops-core-gatekeeper
      priorityClassName: system-cluster-critical
      securityContext:
        runAsNonRoot: true
        # Matches the distroless:nonroot UID the Dockerfile pins.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gatekeeper
          # Pin a released tag >= v2.0.0 by digest; earlier builds never write
          # Gate.status. Don't pair a floating tag with imagePullPolicy:IfNotPresent.
          image: ghcr.io/glueops/platform-gatekeeper:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # Unset means no cross-namespace access at all.
            - name: GATEKEEPER_PLATFORM_ALLOWED_NAMESPACES
              value: "glueops-core"
            - name: GATEKEEPER_PLATFORM_ALLOWED_NAMESPACE_PREFIXES
              value: "glueops-core-"
            - name: GATEKEEPER_RECONCILE_INTERVAL
              value: "30s"
            # Below the memory limit, so growth costs GC rather than an OOMKill.
            - name: GOMEMLIMIT
              value: "200MiB"
          # Process check only: staleness is an alert, not a restart.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: glueops-core-gatekeeper
  namespace: glueops-core-gatekeeper
  labels:
    app.kubernetes.io/name: glueops-core-gatekeeper
spec:
  selector:
    app.kubernetes.io/name: glueops-core-gatekeeper
  ports:
    - name: http
      port: 8080
      targetPort: http
